    <meta charset="utf-8">
    <title>🐙 userver: Dynamic Configs</title>
    <link href="tabulator/css/tabulator.min.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
    <script type="text/javascript" src="tabulator/js/tabulator.min.js"></script>
  </head>
  <body>

<div class="nav-bar">
  <div class="nav-controls">
    <button class="nav-button" id="apply-edits" disabled>☑️ Apply Edits</button>
    <button class="nav-button" id="del-row">🗑</button>
    <button class="nav-button" id="add-row">➕ Add Blank Row</button>
  </div>
</div>

<div class="clear-both"></div>

<div id="the-table"></div>

<script>
    function OnCellChange(cell){
        cell.getElement().classList.add("changed-cell");
        document.getElementById("apply-edits").disabled = false;
    }

    // See https://tabulator.info/
    const table = new Tabulator("#the-table", {
        height:"100%",
        rowHeader:{
            headerSort:false, resizable: false, frozen:true, headerHozAlign:"center", hozAlign:"center", formatter:"rowSelection", titleFormatter:"rowSelection",
            cellClick:function(e, cell){
              cell.getRow().toggleSelect();
            }
        },
        layout:"fitDataStretch",
        columns:[
	        {title:"Name", field:"name", width:"15%", cellEdited:OnCellChange, editor:"input"},
	        {title:"Service", field:"service", width:"15%", cellEdited:OnCellChange, editor:"input"},
	        {title:"Value", field:"value", cellEdited:OnCellChange, editor:"input"}
        ],
    });

    function OnRowDelete(data){
        alert("DELETED: " + data["name"] + " " + data["service"] + " " + data["value"]);
        // TODO: upload to server
    }
    function OnRowUpdate(data){
        alert(data["name"] + " " + data["service"] + " " + data["value"]);
        // TODO: upload to server
    }
    function OnConfigsReceived(data){
        data.forEach((input) => table.addRow(input));
    }

    document.getElementById("add-row").addEventListener("click", function(){
        table.addRow({}, /*add_to_top=*/ true);
    });
    document.getElementById("del-row").addEventListener("click", function(){
        const selected_rows = table.getSelectedRows();
        if (selected_rows.length === 0) {
            alert("No rows selected for deletion. Select the rows via the checkboxes on the left side of the table");
            return;
        } else if (!confirm("Are you sure you want to delete " + selected_rows.length + " rows?")) {
            return;
        }
        table.getSelectedRows().forEach((row) => OnRowDelete(row.getData()));

        window.location.reload()
    });
    document.getElementById("apply-edits").addEventListener("click", function(){
        const affected_rows = new Set()
        table.getEditedCells().forEach((cell) => affected_rows.add(cell.getRow()));
        if (!confirm("Are you sure you want to apply changes to " + affected_rows.size + " rows?")) {
            return;
        }
        affected_rows.forEach((row) => OnRowUpdate(row.getData()));

        window.location.reload()
    });

    fetch('/configs/values', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},  
        body: JSON.stringify({})  
    })
    .then((response) => response.json())  
    .then(OnConfigsReceived)
